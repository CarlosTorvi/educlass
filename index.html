async function teacherPhotoToData(file){if(!file)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Selecciona JPG, PNG o WebP.');if(file.size>5*1024*1024)throw Error('La fotografía no puede superar 5 MB.');const img=await createImageBitmap(file);const scale=Math.min(1,420/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);img.close();const val=canvas.toDataURL('image/webp',.78);if(val.length>280000)throw Error('La fotografía comprimida es demasiado grande. Elige otra.');return val;}
async function saveTeacherProfile(e){e.preventDefault();if(!cloud||!session?.user)return alert('Debes entrar como profesor.');try{const f=$('#tpPhoto').files[0];let avatar=$('#tpRemove').checked?null:(f?await teacherPhotoToData(f):teacherProfile?.avatar_data||null);const row={teacher_id:session.user.id,display_name:$('#tpName').value.trim(),specialty:$('#tpSpecialty').value.trim(),welcome_message:$('#tpWelcome').value.trim(),avatar_data:avatar};if(!row.display_name)throw Error('Escribe el nombre del profesor.');const {error}=await api.from('teacher_profiles').upsert(row,{onConflict:'teacher_id'});if(error)throw error;teacherProfile=row;toast('Perfil docente guardado.');}catch(err){alert('No se pudo guardar el perfil: '+err.message);}}

function toast(s,error=false){flash=s;flashErr=error;render()}
function go(to){page=to;selected=null;stopReader();render()}
function openModal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modalShade" id="modal"><div class="modal"><div class="row between"><h2 style="margin:0">EduClass</h2><button class="button secondary" onclick="closeModal()">Cerrar ×</button></div><div style="margin-top:17px">${html}</div></div></div>`)}
function closeModal(){$('#modal')?.remove()}
function person(s){return `<span class="avatar">${esc(s.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span> <strong>${esc(s.name)}</strong>`}
function render(){if(recoveryMode){renderPasswordRecovery();return}if(location.hash.startsWith('#/ver/')){renderPublic();return}if(location.hash==='#/alumno'){renderStudentEntry();return}if(location.hash==='#/inicio' || (welcome&&location.hash==='')){renderWelcome();return}if(!session&&(cloud||!demoTeacher)){renderLogin();return}let content='';
if(page==='clases')content=header('Mis módulos','Crea varias clases dentro de tu cuenta. Cada tarjeta identifica automáticamente su módulo.')+`<div class="toolbar"><button class="button" onclick="moduleForm()">+ Crear módulo</button></div><div class="grid grid2 section">${db.classes.map(c=>`<div class="card"><div class="row between"><div><span class="eyebrow">CLASE / MÓDULO</span><h2>${esc(c.name)}</h2><small>${db.students.filter(s=>s.class_id===c.id).length} estudiantes · ${db.attendance.filter(a=>a.day===date()&&db.students.some(s=>s.id===a.student_id&&s.class_id===c.id)).length} registros hoy</small></div>${c.id===currentClassId?'<span class="pill">Activo</span>':''}</div><div class="toolbar section"><button class="button" onclick="currentClassId='${c.id}';go('alumnos')">Abrir clase →</button><button class="button secondary" onclick="moduleForm('${c.id}')">Renombrar</button><button class="button danger" onclick="deleteModule('${c.id}')">Eliminar</button></div></div>`).join('')}</div><div class="help section">Cuando pases una tarjeta NFC, EduClass reconocerá al estudiante y cambiará al módulo que tenga asignado. Los registros y puntos se guardan en su ficha, sin mezclarse con los de otras clases.</div>`;

if(page==='inicio'){let presents=classRecords(db.attendance).filter(a=>a.day===date()&&a.state!=='ausente').length,percent=classStudents().length?Math.round(presents/classStudents().length*100):0,positive=classRecords(db.movements).filter(x=>x.amount>0).length;
content=`<div class="welcomeHead"><div><span class="eyebrow">TU CENTRO DE CONTROL</span><h1>${esc(currentClass()?.name||'Tu aula')}, a tu ritmo<span class="headlineDot">.</span></h1><p class="muted">Una visión clara de lo que está pasando. Lo importante, a un toque.</p></div><span class="todayChip">◷ ${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</span></div>
<div class="dashboardHero"><div class="heroText"><span class="heroEyebrow">EDUCLASS STUDIO / NFC</span><h2>Pequeñas acciones.<br><em>Grandes avances.</em></h2><p>Registra la asistencia, celebra logros y acompaña cada trayectoria desde un mismo lugar.</p><div class="toolbar"><button class="button heroBtn" onclick="go('asistencia')">◉ Iniciar asistencia <span>↗</span></button><button class="button heroOutline" onclick="go('puntos')">Gestionar puntos →</button></div></div><div class="heroArtwork" aria-hidden="true"><span class="orbit orbit1"></span><span class="orbit orbit2"></span><span class="orbit orbit3"></span><div class="heroDevice"><span class="devicePing">⌁</span><strong>NFC</strong><small>READY TO SCAN</small></div><span class="orbSmall">✦</span></div></div>
<div class="sectionTitle"><h2>Resumen de tu aula</h2><span>En tiempo real · ${esc(date())}</span></div>
<div class="grid grid4 statGrid"><div class="card stat toneSky"><span class="statIcon">♙</span><small>Estudiantes</small><strong>${classStudents().length.toString().padStart(2,'0')}</strong><span>En tu espacio</span></div><div class="card stat toneMint"><span class="statIcon">✓</span><small>Asistencias hoy</small><strong>${presents.toString().padStart(2,'0')}</strong><span>${percent}% del grupo</span></div><div class="card stat tonePeach"><span class="statIcon">✦</span><small>Logros positivos</small><strong>${positive.toString().padStart(2,'0')}</strong><span>Refuerzos registrados</span></div><div class="card stat toneLavender"><span class="statIcon">◇</span><small>Recompensas</small><strong>${db.rewards.length.toString().padStart(2,'0')}</strong><span>En el catálogo</span></div></div>

function studentDetail(s,actions=false){if(!s)return '<p class="muted">Alumno no encontrado.</p>';let att=db.attendance.filter(x=>x.student_id===s.id),moves=db.movements.filter(x=>x.student_id===s.id),reasons=db.reason_templates||[],first=reasons[0];return `<div class="row between"><div>${person(s)}<br><small>${esc(s.group_name||'Sin módulo')} · Tarjeta ${esc(s.number)}</small></div><h2>${balance(s.id)} ✦</h2></div><p><span class="pill">${att.filter(x=>x.state==='presente').length} asistencias</span> <span class="pill orange">${moves.length} movimientos</span></p>${actions?`<div class="stack"><label>Selecciona un motivo<select id="reason" onchange="reasonChanged()">${reasons.map(r=>`<option value="${r.id}">${r.kind==='negative'?'−':'+'}${r.amount} · ${esc(r.name)}</option>`).join('')}<option value="custom">Otro motivo puntual…</option></select></label><label id="customReasonLabel" style="display:${reasons.length?'none':'grid'}">Motivo personalizado<input id="customReason" maxlength="120" placeholder="Describe el motivo"></label><div class="grid grid2"><label>Cantidad de puntos<input id="amount" type="number" min="0" max="500" value="${first?.amount??5}"></label><label>Experiencia (XP)<input id="manualXp" type="number" min="0" max="500" value="${first?.xp_amount??0}"></label></div><div class="grid grid2"><button class="button green" onclick="magicAwardManual('${s.id}',1)">+ Conceder puntos y XP</button><button class="button danger" onclick="magicAwardManual('${s.id}',-1)">− Restar puntos (XP intactos)</button></div><small>Puedes otorgar solo puntos, solo XP o ambas cosas. Al penalizar se restan puntos, nunca XP acumulados.</small><button class="button secondary" onclick="closeModal();go('motivos')">Configurar motivos</button></div>`:''}`}
function reasonChanged(){let value=$('#reason')?.value,reason=(db.reason_templates||[]).find(r=>r.id===value);$('#customReasonLabel').style.display=value==='custom'?'grid':'none';if(reason){$('#amount').value=reason.amount;const xp=document.getElementById('manualXp');if(xp)xp.value=reason.xp_amount||0;}}

function showStudent(uid){let s=db.students.find(x=>x.id===uid);openModal(`${studentDetail(s,true)}<div class="section"><h3>🎁 Premios conseguidos</h3>${redemptionHistory(new Set([s.id]),true)}</div><div class="section toolbar"><button class="button secondary" onclick="closeModal();editStudent('${s.id}')">Editar alumno</button><button class="button secondary" onclick="copyLink('${s.id}')">Copiar portal alumno</button></div>`)}
async function mutate(table,entry,method='insert'){if(!cloud){let key=table==='incident_messages'?'messages':table;if(method==='delete'){db[key]=db[key].filter(x=>x.id!==entry)}else if(method==='update'){db[key]=db[key].map(x=>x.id===entry.id?{...x,...entry}:x)}else db[key].push(entry);save();return}let q=method==='insert'?api.from(table).insert(entry):method==='update'?api.from(table).update(entry).eq('id',entry.id):api.from(table).delete().eq('id',entry);let {error}=await q;if(error)throw Error(error.message);await loadRemote()}
async function loadRemote(){let tabs=['classes','students','attendance','movements','reason_templates','rewards','redemptions','incidents','incident_messages'];let res=await Promise.all(tabs.map(t=>api.from(t).select('*')));for(let i=0;i<tabs.length;i++){if(res[i].error)throw Error(tabs[i]+': '+res[i].error.message);db[tabs[i]==='incident_messages'?'messages':tabs[i]]=res[i].data}if(!db.classes.length){let obj={id:id(),name:'Mi primera clase',teacher_id:session.user.id};let {error}=await api.from('classes').insert(obj);if(error)throw Error(error.message);db.classes=[obj]}initializeClasses()}
async function changePoints(uid,sign){let value=Number($('#amount').value),template=(db.reason_templates||[]).find(r=>r.id===$('#reason').value),reason=template?.name||$('#customReason')?.value.trim();if(!Number.isInteger(value)||value<1||value>500)return alert('Introduce entre 1 y 500 puntos.');if(!reason)return alert('Escribe un motivo.');try{await mutate('movements',{id:id(),student_id:uid,amount:value*sign,reason,created_at:now(),teacher_id:cloud?session.user.id:undefined});closeModal();selected=uid;toast(sign>0?'Puntos añadidos.':'Puntos descontados.')}catch(e){alert(e.message)}}
function reasonForm(uid=''){let r=(db.reason_templates||[]).find(x=>x.id===uid);openModal(`<form class="stack" onsubmit="magicSaveReason(event,'${uid}')"><label>Nombre del motivo<input id="rLabel" maxlength="120" required value="${esc(r?.name||'')}" placeholder="Ej. Ayudar a un compañero"></label><label>Tipo<select id="rKind"><option value="positive" ${r?.kind!=='negative'?'selected':''}>Positivo (+)</option><option value="negative" ${r?.kind==='negative'?'selected':''}>Penalización de puntos (XP no baja)</option></select></label><div class="grid grid2"><label>Puntos<input id="rPoints" type="number" min="0" max="500" required value="${r?.amount??5}"></label><label>Experiencia (XP)<input id="rXp" type="number" min="0" max="500" required value="${r?.xp_amount??0}"></label></div><p class="muted">Un motivo puede conceder puntos, experiencia o las dos cosas. Las penalizaciones no restan XP.</p><button class="button" type="submit">${r?'Guardar cambios':'Crear motivo'}</button></form>`)}
async function magicSaveReason(e,uid){e.preventDefault();let name=$('#rLabel').value.trim(),kind=$('#rKind').value,amount=Number($('#rPoints').value),xp_amount=Number($('#rXp').value);if(!name||![amount,xp_amount].every(x=>Number.isInteger(x)&&x>=0&&x<=500)||amount+xp_amount===0)return alert('Indica al menos 1 punto o 1 XP; máximo 500 cada uno.');let data={id:uid||id(),name,kind,amount,xp_amount};if(cloud)data.teacher_id=session.user.id;try{await mutate('reason_templates',data,uid?'update':'insert');closeModal();toast(uid?'Motivo actualizado.':'Motivo creado.')}catch(err){alert(err.message+' · Revisa la migración SQL v9.')}}
async function deleteReason(uid){if(!confirm('¿Eliminar este motivo de la lista? El historial de puntos no cambiará.'))return;try{await mutate('reason_templates',uid,'delete');toast('Motivo eliminado.')}catch(err){alert(err.message)}}

async function scanStudent(uid){let s=db.students.find(x=>x.id===uid);if(!s){toast('Tarjeta sin asignar.',true);return}let old=currentClassId;if(s.class_id!==currentClassId){currentClassId=s.class_id;selected=null;}let moduleName=db.classes.find(c=>c.id===s.class_id)?.name||'su módulo';if(mode==='asistencia'){if(status(uid)){toast(s.name+' ya tiene asistencia registrada hoy en '+moduleName+'.');return}try{await mutate('attendance',{id:id(),student_id:uid,day:date(),state:'presente',created_at:now(),teacher_id:cloud?session.user.id:undefined});toast('✓ '+s.name+' · '+moduleName+' · asistencia registrada.')}catch(e){toast(e.message,true)}}else{selected=uid;render()}}
function manualScan(){let uid=$('#manualStudent').value;if(!uid)return alert('Selecciona un estudiante.');scanStudent(uid)}
function extractToken(event){for(const record of event.message.records){try{const decoder=new TextDecoder(record.encoding||'utf-8');let v=decoder.decode(record.data);if(record.recordType==='url'||record.recordType==='text'){let m=v.match(/[#/]ver\/([a-f\d-]{36})/i);if(m)return m[1];if(/^[a-f\d-]{36}$/i.test(v))return v}}catch{}}return null}
async function toggleReader(){if(reading){stopReader();render();return}if(!('NDEFReader' in window)){toast('Este navegador no admite Web NFC. Prueba Chrome en Android con HTTPS y NFC activado.',true);return}try{reader=new NDEFReader();await reader.scan();reading=true;reader.onreading=event=>{let token=extractToken(event);let s=db.students.find(x=>x.card_token===token);if(!s){toast('Tarjeta no reconocida: primero prográmala en EduClass.',true);return}scanStudent(s.id)};reader.onreadingerror=()=>toast('No se ha podido leer esa tarjeta.',true);render()}catch(e){toast('No se pudo activar NFC: '+e.message,true)}}
function stopReader(){if(reader){reader.onreading=null;reader.onreadingerror=null;reader=null}reading=false}
function studentForm(){openModal(`<div class="stack"><label>Nombre completo<input id="stuName" placeholder="Nombre y apellidos"></label><label>Módulo / clase<select id="stuClass">${classOptions(currentClassId)}</select></label><label>Número de tarjeta (puedes dejarlo vacío para reasignar una antigua)<input id="stuNum" value="${String(Math.max(0,...db.students.map(s=>Number(s.number)||0))+1).padStart(4,'0')}"></label><button class="button" onclick="createStudent()">Crear estudiante</button></div>`) }
async function createStudent(){let name=$('#stuName').value.trim(),number=$('#stuNum').value.trim(),class_id=$('#stuClass').value,group_name=db.classes.find(c=>c.id===class_id)?.name||'';if(!name||!class_id)return alert('Completa el nombre y selecciona módulo.');if(number&&db.students.some(s=>s.number===number))return alert('Ese número de tarjeta ya existe en otra clase. Usa otro número: las tarjetas son únicas dentro de tu cuenta.');try{await mutate('students',{id:id(),name,number:number||null,class_id,group_name,card_token:id(),created_at:now(),teacher_id:cloud?session.user.id:undefined});currentClassId=class_id;closeModal();toast('Estudiante creado en '+group_name+'.')}catch(e){alert(e.message)}}
function editStudent(uid){let s=db.students.find(x=>x.id===uid);openModal(`<div class="stack"><label>Nombre<input id="eName" value="${esc(s.name)}"></label><label>Módulo / clase<select id="eClass">${classOptions(s.class_id)}</select></label><label>Número de tarjeta<input id="eNumber" value="${esc(s.number||'')}"></label><p class="muted">Mover un estudiante a otro módulo conserva su historial y tarjeta. Para reutilizarla con una persona distinta, usa «Transferir esta tarjeta».</p><button class="button" onclick="updateStudent('${uid}')">Guardar cambios</button><button class="button secondary" onclick="transferForm('${uid}')">Transferir esta tarjeta</button></div>`) }
async function updateStudent(uid){let name=$('#eName').value.trim(),class_id=$('#eClass').value,group_name=db.classes.find(c=>c.id===class_id)?.name||'',number=$('#eNumber').value.trim();if(!name||!class_id)return alert('Faltan datos.');if(db.students.some(x=>x.id!==uid&&number&&x.number===number))return alert('Número duplicado en tus clases.');try{await mutate('students',{id:uid,name,class_id,group_name,number:number||null},'update');currentClassId=class_id;closeModal();toast('Ficha actualizada.')}catch(e){alert(e.message)}}
function transferForm(uid){let from=db.students.find(s=>s.id===uid);closeModal();openModal(`<div class="stack"><p>Transferirás la tarjeta <strong>${esc(from.number||'sin número')}</strong> a una ficha nueva o existente sin tarjeta, conservando el historial original del alumno.</p><label>Nuevo titular<select id="transferTo">${db.students.filter(s=>s.id!==uid&&!s.number).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><p class="muted">Si no aparece nadie, crea primero un estudiante dejando su número de tarjeta en blanco.</p><button class="button" onclick="transferCard('${uid}')">Confirmar transferencia</button></div>`)}
async function transferCard(uid){let to=$('#transferTo').value;if(!to)return alert('Crea antes una ficha sin tarjeta.');if(!confirm('¿Desvincular tarjeta del estudiante anterior y asignarla al nuevo?'))return;try{if(cloud){let {error}=await api.rpc('transfer_card',{p_from:uid,p_to:to});if(error)throw error;await loadRemote()}else{let a=db.students.find(x=>x.id===uid),b=db.students.find(x=>x.id===to);b.card_token=a.card_token;b.number=a.number;a.card_token=id();a.number=null;save()}closeModal();toast('Tarjeta transferida sin trasladar historiales.')}catch(e){alert(e.message)}}
function linkOf(s){return location.href.split('#')[0]+'#/ver/'+s.card_token}
async function copyLink(uid){let s=db.students.find(x=>x.id===uid);try{await navigator.clipboard.writeText(linkOf(s));alert('Enlace copiado.')}catch{prompt('Copia el enlace:',linkOf(s))}}
async function programCard(uid){let s=db.students.find(x=>x.id===uid);if(!('NDEFReader' in window)){alert('Graba la URL con NFC Tools, o utiliza Chrome para Android con HTTPS.\n\n'+linkOf(s));return}if(!confirm('Acerca una tarjeta NFC NTAG213 vacía o regrabable para grabar el enlace de la tarjeta '+s.number+'.'))return;try{let wr=new NDEFReader();await wr.write({records:[{recordType:'url',data:linkOf(s)}]});alert('Tarjeta grabada correctamente.')}catch(e){alert('No se pudo grabar: '+e.message)}}
function redemptionHistory(ids,compact=false,withFilters=false){
 const rows=(db.redemptions||[]).filter(r=>ids.has(r.student_id)).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
 const pending=rows.filter(r=>r.delivery_status!=='entregado').length,delivered=rows.length-pending;
 const summary=`<div class="rewardStats"><div class="rewardStat"><b>${rows.length}</b><span>Total de canjes</span></div><div class="rewardStat wait"><b>${pending}</b><span>🟠 Pendientes</span></div><div class="rewardStat done"><b>${delivered}</b><span>🟢 Entregados</span></div></div>`;
 if(!rows.length)return (withFilters?summary:'')+'<p class="rewardEmpty">Todavía no hay premios canjeados en esta clase.</p>';
 const filterId='rewardFilter_'+(compact?'student':'class');
 return `${withFilters?summary+`<div class="rewardFilters" role="group" aria-label="Filtrar premios"><button class="selected" onclick="filterRewardRows(this,'${filterId}','todos')">Todos (${rows.length})</button><button onclick="filterRewardRows(this,'${filterId}','pendiente')">🟠 Pendientes (${pending})</button><button onclick="filterRewardRows(this,'${filterId}','entregado')">🟢 Entregados (${delivered})</button></div>`:''}<div class="tablewrap"><table class="tbl rewardTable" id="${filterId}"><thead><tr>${compact?'':'<th>Estudiante</th>'}<th>🎁 Premio conseguido</th><th>Fecha de canje</th><th>Puntos</th><th>Estado</th><th>Gestionar entrega</th></tr></thead><tbody>${rows.map(r=>{
  const isDone=r.delivery_status==='entregado';
  return `<tr data-status="${isDone?'entregado':'pendiente'}">${compact?'':`<td>${esc(nameOf(r.student_id))}</td>`}<td><span class="rewardWon">🎁 ${esc(r.reward_name||db.rewards.find(p=>p.id===r.reward_id)?.name||"Premio registrado")}</span></td><td><small>${esc(fmt(r.created_at))}</small></td><td>−${Number(r.cost)}</td><td><span class="rewardStatus ${isDone?'done':'wait'}">${isDone?'✓ Entregado':'◷ Pendiente'}</span>${isDone&&r.delivered_at?`<small style="display:block">${esc(fmt(r.delivered_at))}</small>`:''}</td><td><button class="button ${isDone?'secondary':'green'} rewardAction" onclick="changeDeliveryStatus('${r.id}','${isDone?'pendiente':'entregado'}')">${isDone?'Volver a pendiente':'✓ Marcar entregado'}</button></td></tr>`;
 }).join('')}</tbody></table></div>`;
}
function filterRewardRows(btn,id,status){
 const table=document.getElementById(id);if(!table)return;
 const filterGroup=btn.parentElement;
 filterGroup.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===btn));
 table.querySelectorAll('tbody tr').forEach(tr=>{tr.hidden=status!=='todos'&&tr.dataset.status!==status;});
}
async function createRewardInline(e){
 e.preventDefault();const name=document.getElementById('rewardInlineName')?.value.trim();const cost=Number(document.getElementById('rewardInlineCost')?.value);
 if(!name||!Number.isInteger(cost)||cost<1||cost>100000)return alert('Indica un nombre y un coste válido.');
 try{await mutate('rewards',{id:id(),name,cost,teacher_id:cloud?session.user.id:undefined});toast('Premio creado correctamente.');}
 catch(err){alert('No se pudo crear el premio: '+err.message)}
}
function downloadRewardsCSV(){
 const ids=classStudentIds();const rows=(db.redemptions||[]).filter(r=>ids.has(r.student_id)).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
 const cells=[['Estudiante','Premio','Puntos descontados','Fecha de canje','Estado de entrega','Fecha de entrega'],...rows.map(r=>[nameOf(r.student_id),r.reward_name,r.cost,fmt(r.created_at),r.delivery_status==='entregado'?'Entregado':'Pendiente',r.delivered_at?fmt(r.delivered_at):''])];
 downloadFile('\ufeff'+cells.map(row=>row.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8','educlass_premios_'+date()+'.csv');
}
async function changeDeliveryStatus(uid,status){
 const r=(db.redemptions||[]).find(x=>x.id===uid);
 if(!r||!['pendiente','entregado'].includes(status))return;
 if(status==='pendiente'&&!confirm('¿Marcar este premio como pendiente de entrega otra vez?'))return;
 const changes={delivery_status:status,delivered_at:status==='entregado'?now():null};
 try{
  if(cloud){const {error}=await api.from('redemptions').update(changes).eq('id',uid);if(error)throw Error(error.message);await loadRemote()}
  else{Object.assign(r,changes);save()}
  closeModal();toast(status==='entregado'?'Premio marcado como entregado.':'Premio marcado como pendiente.');
 }catch(e){alert('No se pudo actualizar el estado: '+e.message)}
}
function rewardForm(){openModal(`<div class="stack"><label>Nombre de recompensa<input id="rName" placeholder="Ej. Elegir una actividad"></label><label>Coste de puntos<input type="number" min="1" id="rCost" value="25"></label><button class="button" onclick="createReward()">Guardar recompensa</button></div>`)}
async function createReward(){let name=$('#rName').value.trim(),cost=parseInt($('#rCost').value,10);if(!name||!cost||cost<1)return alert('Indica nombre y coste.');try{await mutate('rewards',{id:id(),name,cost,teacher_id:cloud?session.user.id:undefined});closeModal();toast('Recompensa creada.')}catch(e){alert(e.message)}}
async function removeReward(uid){if(!confirm('¿Eliminar esta recompensa?'))return;try{await mutate('rewards',uid,'delete');toast('Recompensa eliminada.')}catch(e){alert(e.message)}}
function redeemForm(uid){let r=db.rewards.find(x=>x.id===uid);openModal(`<div class="stack"><h3>${esc(r.name)} · ${r.cost} puntos</h3><label>Estudiante<select id="redeemStudent">${classStudents().map(s=>`<option value="${s.id}">${esc(s.name)} (${balance(s.id)} puntos)</option>`).join('')}</select></label><button class="button" onclick="redeem('${uid}')">Confirmar canje</button></div>`)}
async function redeem(uid){let r=db.rewards.find(x=>x.id===uid),sid=$('#redeemStudent').value;if(balance(sid)<r.cost)return alert('Saldo insuficiente.');try{await mutate('redemptions',{id:id(),student_id:sid,reward_name:r.name,cost:r.cost,created_at:now(),teacher_id:cloud?session.user.id:undefined});closeModal();toast('Canje registrado.')}catch(e){alert(e.message)}}
function downloadFile(data,type,name){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadCSV(){let cells=[['Estudiante','Grupo','Tarjeta','Puntos','Asistencias presentes','Retrasos'],...classStudents().map(s=>[s.name,s.group_name,s.number,balance(s.id),db.attendance.filter(a=>a.student_id===s.id&&a.state==='presente').length,db.attendance.filter(a=>a.student_id===s.id&&a.state==='retraso').length])];downloadFile('\ufeff'+cells.map(row=>row.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8','educlass_'+(currentClass()?.name||'modulo').replace(/[^a-zA-Z0-9_-]/g,'_')+'_informe.csv')}
function exportJSON(){downloadFile(JSON.stringify(db,null,2),'application/json','educlass_copia.json')}
async function importJSON(el){try{let data=JSON.parse(await el.files[0].text());if(!['students','attendance','movements','rewards','redemptions'].every(k=>Array.isArray(data[k])))throw Error('Copia no válida.');db={...sample(),...data};initializeClasses();save();toast('Copia restaurada.')}catch(e){alert(e.message)}}

function enterTeacher(){welcome=false;demoTeacher=false;location.hash='#/docente';render()}
function renderStudentEntry(){welcome=false;$('#app').innerHTML=`<div class="studentGateway">${portalBrand()}<button class="button secondary" onclick="stopPortalReader();location.hash='#/inicio'">← Volver al inicio</button><div class="studentScan"><span class="scanGlow">◉</span><span class="eyebrow">ACCESO ESTUDIANTE</span><h1>Acerca tu tarjeta.</h1><p>Tu recorrido, asistencia, puntos y recompensas en una sola pantalla.</p><button class="button green" onclick="startPortalReader()">◉ Activar lector NFC</button><p id="scanStatus" class="muted">Chrome para Android · NFC activado · Conexión HTTPS</p><div class="demoAccess"><small>¿Quieres explorar una demostración?</small><button class="button secondary" onclick="openDemoStudent()">Ver perfil de ejemplo</button></div></div></div>`}
async function startPortalReader(){if(!('NDEFReader' in window)){const e=$('#scanStatus');if(e)e.textContent='Tu navegador no admite lectura NFC desde web. Si tienes la tarjeta grabada, también puedes acercarla al móvil para abrir directamente su enlace.';return}try{portalReader=new NDEFReader();await portalReader.scan();portalReading=true;$('#scanStatus').textContent='Lector activo. Acerca ahora la tarjeta al móvil.';portalReader.onreading=e=>{let token=extractToken(e);if(token){stopPortalReader();location.hash='#/ver/'+token}else{$('#scanStatus').textContent='Tarjeta sin enlace EduClass válido.'}};portalReader.onreadingerror=()=>{$('#scanStatus').textContent='No se pudo leer la tarjeta. Inténtalo de nuevo.'}}catch(e){$('#scanStatus').textContent='Error NFC: '+e.message}}
function stopPortalReader(){if(portalReader){portalReader.onreading=null;portalReader.onreadingerror=null;portalReader=null}portalReading=false}
function openDemoStudent(){if(cloud){$('#scanStatus').textContent='El perfil de ejemplo solo existe en el modo demostración local.';return}location.hash='#/ver/'+db.students[0].card_token}
function renderPublic(){stopPortalReader();let token=location.hash.split('/').pop();portalToken=token;$('#app').innerHTML=`<div class="portalWrap">${portalBrand()}<div class="card center"><h2>Abriendo tu espacio personal…</h2></div></div>`;if(cloud){api.rpc('student_portal',{p_token:token}).then(({data,error})=>{if(error||!data){$('#app').innerHTML=`<div class="portalWrap">${portalBrand()}<div class="card center"><h2>Tarjeta sin asignar</h2><p>Consulta al docente o revisa la conexión.</p><button class="button secondary" onclick="location.hash='#/inicio'">Volver</button></div></div>`;return}portalData=data;publicCard(data)})}else{let s=db.students.find(x=>x.card_token===token);if(!s){$('#app').innerHTML=`<div class="portalWrap">${portalBrand()}<div class="card center"><h2>Tarjeta no reconocida</h2></div></div>`;return}portalData={name:s.name,group_name:s.group_name,balance:balance(s.id),attendances:db.attendance.filter(x=>x.student_id===s.id).map(x=>({day:x.day,state:x.state})),movements:db.movements.filter(x=>x.student_id===s.id).map(x=>({amount:x.amount,reason:x.reason,created_at:x.created_at})),rewards:db.rewards.map(r=>({name:r.name,cost:r.cost})),incidents:db.incidents.filter(i=>i.student_id===s.id).map(i=>({id:i.id,subject:i.subject,status:i.status,created_at:i.created_at,messages:db.messages.filter(m=>m.incident_id===i.id)}))};publicCard(portalData)}}
function publicCard(d){let attend=d.attendances||[],mov=d.movements||[],inc=d.incidents||[],present=attend.filter(x=>x.state==='presente').length,late=attend.filter(x=>x.state==='retraso').length,absent=attend.filter(x=>x.state==='ausente').length;$('#app').innerHTML=`<div class="portalWrap">${portalBrand()}<div class="portalHero"><div class="eyebrow">MI ESPACIO PERSONAL</div><h1>Hola, ${esc(d.name)} <span class="headlineDot">✦</span></h1><p>${esc(d.group_name||'Mi grupo')} · Consulta individual de progreso</p></div><div class="grid grid4 statGrid"><div class="card stat toneMint"><small>Saldo global</small><strong>${Number(d.balance)||0}</strong><span>puntos disponibles</span></div><div class="card stat toneSky"><small>Asistencia</small><strong>${present}</strong><span>días presentes</span></div><div class="card stat tonePeach"><small>Retrasos</small><strong>${late}</strong><span>registros</span></div><div class="card stat"><small>Ausencias</small><strong>${absent}</strong><span>días</span></div></div><div class="grid grid2 section"><div class="card"><h2>📅 Mi calendario de asistencia</h2>${attendanceCalendar(attend)}<div class="studentEvents">${attend.slice().sort((a,b)=>b.day.localeCompare(a.day)).slice(0,12).map(x=>`<div class="eventLine"><span>${esc(x.day)}</span><span class="pill ${x.state==='ausente'?'red':x.state==='retraso'?'orange':''}">${esc(x.state)}</span></div>`).join('')||'<p class="muted">No hay registros todavía.</p>'}</div></div><div class="card"><h2>✦ Historial de puntos</h2><p class="muted">Cada movimiento registrado, con su motivo.</p>${mov.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,20).map(x=>`<div class="eventLine"><span><b>${esc(x.reason)}</b><br><small>${x.created_at?esc(fmt(x.created_at)):'Registro'}</small></span><strong class="${x.amount>=0?'positive':'negative'}">${x.amount>0?'+':''}${x.amount}</strong></div>`).join('')||'<p class="muted">No hay puntos registrados.</p>'}</div></div><div class="grid grid2 section"><div class="card"><h2>◇ Recompensas</h2>${(d.rewards||[]).map(r=>`<div class="eventLine"><span>${esc(r.name)}</span><b>${Number(r.cost)} ✦</b></div>`).join('')||'<p class="muted">Sin recompensas.</p>'}</div><div class="card"><h2>✉ Incidencias con mi profesor</h2><p class="muted">¿Hay algún error en tus puntos o asistencia? Escríbelo aquí. Tu docente recibirá el mensaje.</p><div class="stack"><label>Asunto<input id="incidentSubject" maxlength="100" placeholder="Ej. Falta incorrecta del 12/11"></label><label>Describe lo ocurrido<textarea id="incidentBody" maxlength="2000" rows="3" placeholder="Explica qué registro deseas revisar..."></textarea></label><button class="button" onclick="submitIncident()">Enviar incidencia</button></div></div></div><div class="card section"><h2>Mis conversaciones</h2>${inc.map(t=>`<div class="ticket"><div class="row between"><b>${esc(t.subject)}</b><span class="pill ${t.status==='cerrada'?'orange':''}">${esc(t.status||'abierta')}</span></div>${(t.messages||[]).map(m=>`<div class="bubble ${m.sender==='teacher'?'teacherBubble':'studentBubble'}"><small>${m.sender==='teacher'?'Profesor':'Yo'} · ${m.created_at?esc(fmt(m.created_at)):''}</small><p>${esc(m.body)}</p></div>`).join('')}<div class="row"><input id="reply_${t.id}" maxlength="2000" placeholder="Responder al docente…" style="flex:1"><button class="button secondary" onclick="sendStudentReply('${t.id}')">Enviar</button></div></div>`).join('')||'<p class="muted">Todavía no has enviado incidencias.</p>'}</div><p class="center muted section">Acceso de consulta. Los datos no se pueden editar desde este portal.</p><div class="center section"><button class="button secondary" onclick="location.hash='#/inicio'">← Inicio EduClass</button></div></div>`}
function attendanceCalendar(rows){let map=new Map(rows.map(x=>[x.day,x.state])),d=new Date(),yr=d.getFullYear(),mo=d.getMonth(),count=new Date(yr,mo+1,0).getDate(),start=(new Date(yr,mo,1).getDay()+6)%7;let html='<div class="calGrid">'+['L','M','X','J','V','S','D'].map(x=>`<span class="calDay">${x}</span>`).join('');for(let i=0;i<start;i++)html+='<span></span>';for(let i=1;i<=count;i++){let key=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(i).padStart(2,'0'),st=map.get(key)||'';html+=`<span title="${esc(st||'Sin registro')}" class="calCell ${esc(st)}">${i}</span>`}return html+'</div><small class="muted">Verde: presente · Naranja: retraso · Rojo: ausencia · Azul: justificada</small>'}
async function submitIncident(){let subject=$('#incidentSubject').value.trim(),body=$('#incidentBody').value.trim();if(subject.length<3||body.length<5)return alert('Escribe un asunto y una descripción suficientemente claros.');try{if(cloud){let {error}=await api.rpc('student_submit_incident',{p_token:portalToken,p_subject:subject,p_body:body});if(error)throw error}else{let s=db.students.find(x=>x.card_token===portalToken),tid=id();db.incidents.push({id:tid,student_id:s.id,subject,status:'abierta',created_at:now()});db.messages.push({id:id(),incident_id:tid,sender:'student',body,created_at:now()});save()}renderPublic()}catch(e){alert('No se pudo enviar: '+e.message)}}
async function sendStudentReply(ticketId){let body=$('#reply_'+ticketId)?.value.trim();if(!body)return;try{if(cloud){let {error}=await api.rpc('student_reply_incident',{p_token:portalToken,p_incident:ticketId,p_body:body});if(error)throw error}else{let s=db.students.find(x=>x.card_token===portalToken),t=db.incidents.find(x=>x.id===ticketId&&x.student_id===s.id);if(!t)throw Error('Incidencia no encontrada');db.messages.push({id:id(),incident_id:ticketId,sender:'student',body,created_at:now()});save()}renderPublic()}catch(e){alert(e.message)}}
function renderInbox(){return header('Bandeja de incidencias','Mensajes que te envía el alumnado desde sus tarjetas NFC.')+`<div class="help">Cada incidencia queda asociada a la ficha y tarjeta del alumno; solo su docente puede responder en el panel.</div><div class="section">${(db.incidents||[]).filter(t=>classStudentIds().has(t.student_id)).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(t=>`<div class="card ticket"><div class="row between"><div><small>${esc(nameOf(t.student_id))} · ${t.created_at?esc(fmt(t.created_at)):''}</small><h2>${esc(t.subject)}</h2></div><span class="pill ${t.status==='cerrada'?'orange':''}">${esc(t.status)}</span></div>${(db.messages||[]).filter(m=>m.incident_id===t.id).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).map(m=>`<div class="bubble ${m.sender==='teacher'?'teacherBubble':'studentBubble'}"><small>${m.sender==='teacher'?'Tú':'Estudiante'} · ${m.created_at?esc(fmt(m.created_at)):''}</small><p>${esc(m.body)}</p></div>`).join('')}<div class="row"><input style="flex:1" id="tr_${t.id}" maxlength="2000" placeholder="Escribe tu respuesta…"><button class="button" onclick="teacherReply('${t.id}')">Responder</button><button class="button secondary" onclick="toggleTicket('${t.id}')">${t.status==='cerrada'?'Reabrir':'Cerrar'} incidencia</button></div></div>`).join('')||'<div class="card empty">No hay incidencias todavía. Los mensajes del alumnado aparecerán aquí.</div>'}</div>`}
async function teacherReply(tid){let body=$('#tr_'+tid)?.value.trim();if(!body)return;try{await mutate('incident_messages',{id:id(),incident_id:tid,teacher_id:cloud?session.user.id:undefined,sender:'teacher',body,created_at:now()});toast('Respuesta enviada al estudiante.')}catch(e){alert(e.message)}}
async function toggleTicket(tid){let t=db.incidents.find(x=>x.id===tid);try{await mutate('incidents',{id:tid,status:t.status==='cerrada'?'abierta':'cerrada'},'update');toast('Estado actualizado.')}catch(e){alert(e.message)}}
function renderLogin(){let register=authView==='register',forgot=authView==='forgot';$('#app').innerHTML=`<div class="login">${portalBrand()}<div class="card"><span class="eyebrow">ESPACIO DOCENTE</span><h1>${forgot?'Recuperar contraseña':register?'Crear cuenta docente':'Bienvenido de nuevo'}</h1><p class="muted">${forgot?'Te enviaremos un enlace para establecer una contraseña nueva.':register?'Tu aula, tus tarjetas y tu alumnado, bajo tu control.':'Entra a tu centro de control EduClass.'}</p>${!cloud?'<div class="help">Modo demostración: para utilizar la nube necesitas activar Supabase.</div>':''}${forgot?`<form class="stack" onsubmit="requestPasswordRecovery(event)"><label>Correo electrónico<input id="email" type="email" autocomplete="email" required placeholder="docente@ejemplo.com"></label><button class="button" type="submit" ${!cloud?'disabled':''}>Enviar enlace de recuperación</button></form>`:`<form class="stack" onsubmit="${register?'registerTeacher(event)':'login(event)'}">${register?'<label>Nombre o nick público<input id="nick" minlength="2" maxlength="40" required placeholder="Ej. Profe Sara"></label>':''}<label>Correo electrónico<input id="email" type="email" autocomplete="email" required placeholder="docente@ejemplo.com"></label><label>Contraseña<input id="password" type="password" minlength="8" autocomplete="${register?'new-password':'current-password'}" required></label><button class="button" type="submit" ${!cloud?'disabled':''}>${register?'Crear mi cuenta':'Entrar como docente'}</button></form>`}<p id="loginMsg" class="muted" role="status" aria-live="polite"></p>${!forgot&&!register?'<button class="button secondary width section" onclick="authView=\'forgot\';renderLogin()">¿Has olvidado tu contraseña?</button>':''}<button class="button secondary width section" onclick="authView='${register||forgot?'login':'register'}';renderLogin()">${register||forgot?'← Volver a iniciar sesión':'Soy nuevo · Crear cuenta docente'}</button>${!cloud&&!forgot?'<button class="button green width section" onclick="enterDemoTeacher()">Explorar panel docente (demo)</button>':''}<button class="button secondary width section" onclick="location.hash='#/inicio'">← Volver al inicio</button></div></div>`}
async function requestPasswordRecovery(e){e.preventDefault();if(!cloud)return;let msg=$('#loginMsg');msg.textContent='Solicitando enlace…';let email=$('#email').value.trim();let redirectTo=location.origin+location.pathname+'?recovery=1';let {error}=await api.auth.resetPasswordForEmail(email,{redirectTo});msg.textContent=error?'No se ha podido enviar el correo: '+error.message:'Si tu correo está registrado, recibirás un enlace. Comprueba también la carpeta de spam.'}
function renderPasswordRecovery(){if(!cloud){recoveryMode=false;renderLogin();return}$('#app').innerHTML=`<div class="login">${portalBrand()}<div class="card"><span class="eyebrow">ESPACIO DOCENTE</span><h1>Establecer nueva contraseña</h1>${session?`<p class="muted">Escribe y confirma una contraseña nueva para tu cuenta docente.</p><form class="stack" onsubmit="updateRecoveredPassword(event)"><label>Nueva contraseña<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Repetir contraseña<input id="repeatPassword" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit" class="button">Guardar contraseña</button></form>`:`<p class="notice error">No se ha podido validar el enlace de recuperación. Puede haber caducado o haberse utilizado ya.</p><button class="button" onclick="leavePasswordRecovery(true)">Solicitar un enlace nuevo</button>`}<p id="recoveryMsg" class="muted" role="status" aria-live="polite"></p><button class="button secondary width section" onclick="leavePasswordRecovery(false)">← Volver al inicio</button></div></div>`}
function leavePasswordRecovery(forgot){recoveryMode=false;authView=forgot?'forgot':'login';welcome=false;history.replaceState(null,'',location.pathname+'#/docente');render()}
async function updateRecoveredPassword(e){e.preventDefault();let msg=$('#recoveryMsg'),pass=$('#newPassword').value,repeat=$('#repeatPassword').value;if(pass!==repeat){msg.textContent='Las dos contraseñas no coinciden.';return}if(pass.length<8){msg.textContent='La contraseña debe tener al menos 8 caracteres.';return}msg.textContent='Actualizando contraseña…';let {error}=await api.auth.updateUser({password:pass});if(error){msg.textContent='No se pudo cambiar la contraseña: '+error.message;return}await api.auth.signOut();session=null;recoveryMode=false;authView='login';welcome=false;history.replaceState(null,'',location.pathname+'#/docente');render();let loginMsg=$('#loginMsg');if(loginMsg)loginMsg.textContent='Contraseña actualizada. Inicia sesión con tu nueva contraseña.'}
function enterDemoTeacher(){welcome=false;demoTeacher=true;location.hash='#/docente';render()}
async function registerTeacher(e){e.preventDefault();if(!cloud)return;let nick=$('#nick').value.trim(),email=$('#email').value.trim(),password=$('#password').value;if(nick.length<2)return;let msg=$('#loginMsg');msg.textContent='Registrando…';let {data,error}=await api.auth.signUp({email,password,options:{data:{nick},emailRedirectTo:location.href.split('#')[0]+'#/docente'}});if(error){msg.textContent=error.message;return}if(data.session){session=data.session;try{await ensureTeacher();await loadRemote();await loadTeacherProfile();render()}catch(ex){msg.textContent=ex.message}}else{msg.textContent='Cuenta creada. Revisa tu correo para confirmar la dirección y después inicia sesión.';authView='login'}}
async function ensureTeacher(){
  // En instalaciones donde el docente ya fue registrado por el administrador,
  // la función RPC de auto-registro no es imprescindible.
  let {error}=await api.rpc('register_teacher');
  if(!error)return;
  if(error.code!=='PGRST202')throw Error(error.message);
  // No crear docentes automáticamente ni sortear permisos: verificar el perfil
  // existente mediante las políticas RLS de Supabase.
  let {data:teacher, error:checkError}=await api.from('teachers').select('*').eq('id',session.user.id).maybeSingle();
  if(checkError)throw Error('No se pudo verificar el perfil docente: '+checkError.message);
  if(!teacher)throw Error('La cuenta está autenticada, pero no consta como docente autorizado. Revisa el registro de teachers en Supabase.');
}
async function login(e){e.preventDefault();let msg=$('#loginMsg');msg.textContent='Entrando…';let {data,error}=await api.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){msg.textContent=error.message;return}session=data.session;try{await ensureTeacher();await loadRemote();render()}catch(ex){await api.auth.signOut();session=null;msg.textContent='No se pudo iniciar sesión: '+ex.message}}
async function logout(){if(cloud)await api.auth.signOut();session=null;teacherProfile=null;demoTeacher=false;welcome=false;authView='login';db=sample();currentClassId=null;initializeClasses();page='inicio';selected=null;location.hash='#/docente';render()}
window.addEventListener('hashchange',()=>{stopReader();stopPortalReader();render()});
if(cloud){api.auth.onAuthStateChange((event,newSession)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;session=newSession;renderPasswordRecovery()}})}
(async()=>{if(cloud){let {data,error}=await api.auth.getSession();session=error?null:data.session;if(session&&!recoveryMode){try{await ensureTeacher();await loadRemote();await loadTeacherProfile()}catch(e){flash='No se pudieron cargar los datos: '+e.message;flashErr=true}}}save();render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script><script src="educlass-magic.js"></script></body></html>
